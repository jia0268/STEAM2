<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>馬格納斯：V25 專業影像過濾系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --brand-cyan: #06b6d4; --brand-red: #ef4444; --brand-orange: #f97316; }
        body { margin: 0; background: #000; color: white; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; height: 100dvh; }
        
        #container { position: relative; width: 100vw; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* 核心影像顯示：使用 contain 確保不被截斷 */
        video, #result-canvas { 
            position: absolute; 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            z-index: 1; 
        }
        
        #result-canvas { z-index: 10; display: none; }
        
        /* 遮罩容器：必須與影像實際顯示範圍完全同步 */
        #mask-container {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            display: flex;
            transition: opacity 0.3s;
        }

        /* 響應式控制面板 */
        .ui-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            z-index: 100; pointer-events: none;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .controls-wrapper {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 24px 24px 0 0;
            padding: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .controls-wrapper.collapsed { transform: translateY(calc(100% - 60px)); }

        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: white; margin-top: -8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        .recording-dot { width: 10px; height: 10px; background: var(--brand-red); border-radius: 50%; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="result-canvas"></canvas>
    
    <div id="mask-container">
        <div id="fixed-mask" class="relative border-r border-dashed border-red-500/50 bg-red-500/10"></div>
        <div id="transition-mask" class="relative border-r border-dotted border-orange-500/50 bg-orange-500/10"></div>
    </div>

    <!-- 頂部狀態 -->
    <div class="absolute top-4 inset-x-0 flex justify-center z-[110] pointer-events-none">
        <div id="status" class="bg-black/50 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 text-[11px] font-bold flex items-center gap-2">
            <div id="status-indicator" class="w-2 h-2 rounded-full bg-emerald-500"></div>
            <span id="status-text" class="tracking-wider uppercase">Ready</span>
        </div>
    </div>

    <!-- 錄製環 -->
    <div id="recording-overlay" class="absolute inset-0 z-[150] bg-black/60 hidden flex-col items-center justify-center">
        <div class="relative w-32 h-32 flex items-center justify-center">
            <svg class="absolute inset-0 w-full h-full rotate-[-90deg]">
                <circle cx="64" cy="64" r="50" stroke="white" stroke-opacity="0.1" stroke-width="4" fill="transparent" />
                <circle id="progress-ring" cx="64" cy="64" r="50" stroke="#06b6d4" stroke-width="4" fill="transparent" stroke-dasharray="314" stroke-dashoffset="314" class="transition-all duration-100 ease-linear" />
            </svg>
            <span id="countdown-text" class="text-3xl font-mono font-bold">2.5</span>
        </div>
        <div class="mt-6 flex items-center gap-2">
            <div class="recording-dot"></div>
            <span class="text-xs font-black tracking-widest uppercase">Capturing Frames...</span>
        </div>
    </div>

    <!-- 控制介面 -->
    <div class="ui-overlay">
        <div id="controls-panel" class="controls-wrapper">
            <!-- 拖動把手 / 收納按鈕 -->
            <div class="flex justify-center mb-2 touch-none" onclick="toggleUI()">
                <div class="w-12 h-1.5 bg-white/20 rounded-full"></div>
            </div>

            <div class="flex items-center justify-between mb-4">
                <button id="btn-switch" class="p-2.5 bg-white/5 rounded-full active:bg-white/20 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">系統參數調整</div>
                <div class="w-10"></div> <!-- Spacer -->
            </div>

            <div id="params-grid" class="grid grid-cols-2 gap-x-6 gap-y-4 mb-6">
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase"><span>固定區</span><span id="val-p">25%</span></div>
                    <input type="range" id="person-mask" min="0" max="50" value="25">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase"><span>過濾區</span><span id="val-t">20%</span></div>
                    <input type="range" id="transition-width" min="0" max="40" value="20">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase"><span>過濾強度</span><span id="val-s">60</span></div>
                    <input type="range" id="skin-sensitivity" min="0" max="100" value="60">
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[10px] text-gray-400 uppercase"><span>偵測靈敏度</span><span id="val-v">45</span></div>
                    <input type="range" id="sensitivity-slider" min="5" max="150" value="45">
                </div>
            </div>

            <div class="flex gap-3">
                <button id="btn-start" class="flex-1 bg-cyan-600 hover:bg-cyan-500 active:scale-95 py-3.5 rounded-2xl font-black text-sm tracking-widest transition-all">
                    START CAPTURE
                </button>
                <button id="btn-reset" class="flex-1 bg-white/10 hover:bg-white/20 active:scale-95 py-3.5 rounded-2xl font-black text-sm tracking-widest hidden transition-all">
                    RESET CAMERA
                </button>
            </div>
        </div>
    </div>
</div>

<canvas id="internal-canvas" class="hidden"></canvas>

<script>
    const state = {
        isCapturing: false,
        frames: [],
        bgFrame: null,
        currentFacingMode: 'environment',
        stream: null,
        uiCollapsed: false
    };

    const dom = {
        video: document.getElementById('video'),
        resCanvas: document.getElementById('result-canvas'),
        intCanvas: document.getElementById('internal-canvas'),
        maskWrap: document.getElementById('mask-container'),
        fixedMask: document.getElementById('fixed-mask'),
        transMask: document.getElementById('transition-mask'),
        overlay: document.getElementById('recording-overlay'),
        progRing: document.getElementById('progress-ring'),
        countDown: document.getElementById('countdown-text'),
        btnStart: document.getElementById('btn-start'),
        btnReset: document.getElementById('btn-reset'),
        btnSwitch: document.getElementById('btn-switch'),
        controls: document.getElementById('controls-panel'),
        statusText: document.getElementById('status-text'),
        statusInd: document.getElementById('status-indicator'),
        inPerson: document.getElementById('person-mask'),
        inTrans: document.getElementById('transition-width'),
        inSkin: document.getElementById('skin-sensitivity'),
        inSens: document.getElementById('sensitivity-slider'),
        vP: document.getElementById('val-p'), vT: document.getElementById('val-t'),
        vS: document.getElementById('val-s'), vV: document.getElementById('val-v')
    };

    const ctx = {
        res: dom.resCanvas.getContext('2d'),
        int: dom.intCanvas.getContext('2d', { willReadFrequently: true })
    };

    async function init() {
        if (state.stream) state.stream.getTracks().forEach(t => t.stop());
        try {
            state.stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: state.currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            dom.video.srcObject = state.stream;
            dom.video.onloadedmetadata = () => {
                const w = dom.video.videoWidth;
                const h = dom.video.videoHeight;
                dom.intCanvas.width = dom.resCanvas.width = w;
                dom.intCanvas.height = dom.resCanvas.height = h;
                syncLayout();
            };
        } catch (e) {
            updateStatus("Camera Error", "bg-red-500");
        }
    }

    // 同步 UI 佈局與影像實際尺寸
    function syncLayout() {
        const v = dom.video;
        const container = document.getElementById('container');
        
        // 取得 video 在螢幕上實際顯示的矩形 (object-fit: contain)
        const vW = v.videoWidth;
        const vH = v.videoHeight;
        const cW = container.clientWidth;
        const cH = container.clientHeight;
        
        const scale = Math.min(cW / vW, cH / vH);
        const actualW = vW * scale;
        const actualH = vH * scale;

        // 強制同步遮罩層與影片顯示區域
        dom.maskWrap.style.width = `${actualW}px`;
        dom.maskWrap.style.height = `${actualH}px`;
        
        dom.fixedMask.style.width = `${dom.inPerson.value}%`;
        dom.transMask.style.width = `${dom.inTrans.value}%`;
        
        dom.vP.innerText = `${dom.inPerson.value}%`;
        dom.vT.innerText = `${dom.inTrans.value}%`;
        dom.vS.innerText = dom.inSkin.value;
        dom.vV.innerText = dom.inSens.value;
    }

    function toggleUI() {
        state.uiCollapsed = !state.uiCollapsed;
        dom.controls.classList.toggle('collapsed', state.uiCollapsed);
    }

    function updateStatus(text, color) {
        dom.statusText.innerText = text;
        dom.statusInd.className = `w-2 h-2 rounded-full ${color}`;
    }

    function isBody(r, g, b, sens) {
        const s = sens / 100;
        if (r < 50*(2-s) && g < 50*(2-s) && b < 50*(2-s)) return true;
        if (r > g && g > b) {
            const sat = r - b;
            if (sat > 25 && r > 50) {
                if (r/(g+1) > (1.1 + 0.3*s)) return true;
            }
        }
        return false;
    }

    async function capture(startTime) {
        const elapsed = Date.now() - startTime;
        if (elapsed < 2500) {
            const progress = elapsed / 2500;
            dom.progRing.style.strokeDashoffset = 314 - (progress * 314);
            dom.countDown.innerText = ((2500 - elapsed) / 1000).toFixed(1);
            
            ctx.int.drawImage(dom.video, 0, 0);
            state.frames.push(ctx.int.getImageData(0, 0, dom.intCanvas.width, dom.intCanvas.height));
            requestAnimationFrame(() => capture(startTime));
        } else {
            render();
        }
    }

    function render() {
        dom.overlay.style.display = 'none';
        updateStatus("Processing...", "bg-orange-500 animate-pulse");

        setTimeout(() => {
            const w = dom.intCanvas.width;
            const h = dom.intCanvas.height;
            const pX = w * (dom.inPerson.value / 100);
            const tX = pX + (w * (dom.inTrans.value / 100));
            const sens = parseInt(dom.inSens.value);
            const sSens = parseInt(dom.inSkin.value);

            ctx.res.putImageData(state.bgFrame, 0, 0);
            const final = ctx.res.getImageData(0, 0, w, h);
            const target = final.data;
            const base = state.bgFrame.data;
            const map = new Float32Array(w * h);

            state.frames.forEach(f => {
                const data = f.data;
                for (let i = 0; i < data.length; i += 4) {
                    const idx = i >> 2;
                    const x = idx % w;
                    if (x < pX) continue;

                    const r = data[i], g = data[i+1], b = data[i+2];
                    const diff = Math.abs(r - base[i]) + Math.abs(g - base[i+1]) + Math.abs(b - base[i+2]);

                    if (diff > sens) {
                        const scale = (x < tX) ? 1.4 : 1.0;
                        if (isBody(r, g, b, sSens * scale)) continue;
                        if (diff > map[idx]) {
                            map[idx] = diff;
                            target[i] = r; target[i+1] = g; target[i+2] = b;
                        }
                    }
                }
            });

            ctx.res.putImageData(final, 0, 0);
            dom.resCanvas.style.display = 'block';
            dom.video.style.display = 'none';
            dom.maskWrap.style.display = 'none';
            dom.btnStart.classList.add('hidden');
            dom.btnReset.classList.remove('hidden');
            updateStatus("Complete", "bg-emerald-500");
        }, 50);
    }

    dom.btnStart.onclick = () => {
        state.frames = [];
        dom.overlay.style.display = 'flex';
        if (!state.uiCollapsed) toggleUI();
        ctx.int.drawImage(dom.video, 0, 0);
        state.bgFrame = ctx.int.getImageData(0, 0, dom.intCanvas.width, dom.intCanvas.height);
        capture(Date.now());
    };

    dom.btnReset.onclick = () => {
        dom.resCanvas.style.display = 'none';
        dom.video.style.display = 'block';
        dom.maskWrap.style.display = 'flex';
        dom.btnStart.classList.remove('hidden');
        dom.btnReset.classList.add('hidden');
        if (state.uiCollapsed) toggleUI();
        updateStatus("Ready", "bg-emerald-500");
    };

    dom.btnSwitch.onclick = () => {
        state.currentFacingMode = state.currentFacingMode === 'user' ? 'environment' : 'user';
        init();
    };

    [dom.inPerson, dom.inTrans, dom.inSkin, dom.inSens].forEach(el => el.oninput = syncLayout);
    window.addEventListener('resize', syncLayout);
    
    // 初始化
    init();
</script>

</body>
</html>
